<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- ENCABEZADO DEL FORMULARIO -->
  <div style="margin-bottom: 20px;">
    <h2>Ponte en contacto</h2>
    <p>Completa el siguiente formulario para enviarme un mensaje.</p>
  </div>

  <!-- FORMULARIO DE CONTACTO SIMULADO -->
  <ion-item>
    <ion-input label="Nombre" labelPlacement="floating" placeholder="Ingresa tu nombre" [(ngModel)]="nombre"></ion-input>
  </ion-item>

  <ion-item>
    <ion-input label="Mensaje" labelPlacement="floating" placeholder="Escribe tu mensaje" [(ngModel)]="mensaje"></ion-input>
  </ion-item>

  <!-- RANGO DE PRIORIDAD -->
  <ion-item>
    <ion-label position="stacked">Nivel de Prioridad (1-5)</ion-label>
    <ion-range [min]="1" [max]="5" [step]="1" [snaps]="true" [pin]="true" [(ngModel)]="prioridad"></ion-range>
  </ion-item>

  <!-- BOTÓN PARA ENVIAR (Simulado) -->
  <div class="ion-margin-top">
    <ion-button expand="block" (click)="enviarMensaje()">
      Enviar Mensaje
    </ion-button>
  </div>

  <!-- VISUALIZACIÓN DEL MENSAJE ENVIADO -->
  <ion-card *ngIf="datosEnviados" style="margin-top: 30px; border-left: 4px solid var(--ion-color-success);">
    <ion-card-header>
      <ion-card-title>Mensaje Recibido</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>De:</strong> {{ datosEnviados.nombre }}</p>
      <p><strong>Prioridad:</strong> {{ datosEnviados.prioridad }} de 5</p>
      <p><strong>Mensaje:</strong></p>
      <p style="background: var(--ion-color-light); padding: 10px; border-radius: 5px; margin-top: 10px;">
        {{ datosEnviados.mensaje }}
      </p>
    </ion-card-content>
  </ion-card>

</ion-content>
